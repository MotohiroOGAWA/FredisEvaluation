[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fredis-evaluation"
version = "0.1.0"
description = "Independent spectrum coverage and prediction result evaluation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "matplotlib>=3.7", "h5py", "pyarrow", "rdkit", "msentity>=0.1.0"]

[project.scripts]
fredis-evaluation = "evaluation.cli:main"

[tool.setuptools.packages.find]
include = ["evaluation*"]

[tool.setuptools.package-data]
evaluation = ["file-formats.json"]

[tool.pytest.ini_options]
testpaths = ["tests/evaluation"]
